<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>濁水溪口｜招潮蟹 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      border-radius: 12px;
      font-family: sans-serif;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('target-events', {
      init: function () {
        const target = this.el;

        target.addEventListener('targetFound', function () {
          document.getElementById('status').textContent =
            '辨識成功！';
        });

        target.addEventListener('targetLost', function () {
          document.getElementById('status').textContent =
            '請對準招潮蟹圖卡';
        });
      }
    });

    window.addEventListener('DOMContentLoaded', function () {
      ['background', 'midground'].forEach(function (id) {
        const img = document.getElementById(id);

        img.addEventListener('error', function () {
          document.getElementById('status').textContent =
            '圖片載入失敗：' + img.getAttribute('src');
        });
      });
    });
  </script>
</head>

<body>
  <div class="ar-container">

    <div id="status">請對準招潮蟹圖卡</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 5; missTolerance: 5;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded>

      <!-- 圖片素材 -->
      <a-assets timeout="15000">

        <img id="background"
          src="./background.png"
          crossorigin="anonymous">

        <img id="midground"
          src="./midground.png"
          crossorigin="anonymous">

      </a-assets>

      <!-- AR 相機 -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- 圖卡追蹤 -->
      <a-entity
        mindar-image-target="targetIndex: 0"
        target-events>

        <!-- 第一層：背景完全固定 -->
        <a-image
          src="#background"
          position="0 0 0.01"
          width="1.4"
          height="0.84"
          material="shader: flat; transparent: true; depthWrite: false; side: double">
        </a-image>

        <!-- 第二層：中景左上 ↔ 右下移動 -->
        <a-image
          src="#midground"
          position="-0.20 0.08 0.08"
          width="1.1"
          height="0.75"
          material="shader: flat; transparent: true; depthWrite: false; side: double"

          animation="
            property: position;
            from: -0.20 0.08 0.08;
            to: 0.25 -0.08 0.08;
            dur: 1800;
            dir: alternate;
            loop: true;
            easing: easeInOutSine;
          ">
        </a-image>

      </a-entity>

    </a-scene>
  </div>
</body>
</html>
